    <script>
      // Paleta salva antes do primeiro quadro (sem piscar a padrão), como o store.ts do Lumo
      (function () {
        var C = {
          grafite: ['#0d0f13', '#13161b', '#0a0c0f', '#1a1e25', '#e8ecf2', '#8a94a3', '#8fa6c4', '#6a86ad', '#b7c4d6', '#0b1018', 'sans'],

          indigo: ['#09070f', '#110e1b', '#070509', '#191428', '#ece9f7', '#8d86a6', '#9b8cff', '#7566e0', '#c4b9ff', '#0c0818', 'sans'],
          ambar: ['#0c0904', '#16110a', '#080603', '#201910', '#f3ebdd', '#9a8c75', '#f0a64a', '#cf8530', '#ffd08a', '#1a0f02', 'sans'],
          noir: ['#030303', '#0b0b0c', '#020202', '#131315', '#ededed', '#7c7c82', '#e5484d', '#b83a3f', '#ff8a8e', '#fff4f4', 'sans'],
          matrix: ['#000000', '#04100a', '#010603', '#07180f', '#c9ffd9', '#4f9a69', '#00ff66', '#00c250', '#7dffb0', '#001a08', 'mono'],
        };
        var id = 'safira';
        try {
          var s = JSON.parse(localStorage.getItem('lumo.site') || '{}');
          if (C[s.palette]) id = s.palette;
          var q = new URLSearchParams(location.search).get('paleta');
          if (C[q]) id = q;
        } catch (e) {}
        var c = C[id], r = document.documentElement, n = ['shell', 'surface', 'surface-2', 'surface-3', 'text', 'muted', 'accent', 'accent-2', 'accent-3', 'on-accent'];
        for (var i = 0; i < n.length; i++) r.style.setProperty('--' + n[i], c[i]);
        r.style.setProperty('--mood', c[6]);
        r.style.setProperty('--accent-solid', id === 'noir' ? c[7] : c[6]);
        r.dataset.palette = id;
        r.dataset.font = c[10];
      })();
    </script>
